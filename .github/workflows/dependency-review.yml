name: Dependency Review

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check dependency graph availability
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status="$(
            curl --silent                  --output /dev/null                  --write-out "%{http_code}"                  -H "Accept: application/vnd.github+json"                  -H "Authorization: Bearer ${GH_TOKEN}"                  -H "X-GitHub-Api-Version: 2022-11-28"                  "https://api.github.com/repos/${REPOSITORY}/dependency-graph/sbom"
          )"

          if [ "${status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Dependency Graph available; dependency review will run." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::GitHub Dependency Graph is unavailable (HTTP ${status}); dependency review was skipped. This job is NOT evidence of dependency review coverage."
            {
              echo "### Dependency review NOT performed"
              echo "GitHub Dependency Graph returned HTTP ${status}. Dependency Review was skipped."
              echo "Release status remains blocked until the independent security gate succeeds."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
