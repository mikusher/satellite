name: CI

on:
  push:
    branches:
      - master
      - satellite-v2-foundation
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify architecture boundaries
        run: python3 scripts/check_module_boundaries.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
